entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"

api:
  dashboard: true
  # Never expose the dashboard/API without authentication: it leaks the
  # full routing table, including per-user auth tokens in router rules.
  # With `insecure: false` and no dashboard router defined, the dashboard
  # is disabled. To inspect it locally, use `docker exec` or temporarily
  # add a localhost-only router with basic auth.
  insecure: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: "traefik-network"
    exposedByDefault: false
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true

log:
  level: INFO



